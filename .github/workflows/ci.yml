
name: VisionGuard CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  python-checks:
    name: Python ${{ matrix.python-version }} Checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install testing tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest

      - name: Python syntax validation
        run: |
          python -m compileall -q app run.py

      - name: Critical lint checks
        run: |
          flake8 app run.py --select=E9,F63,F7,F82

      - name: Run tests if available
        shell: bash
        run: |
          if [ -d tests ] && find tests -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -q
          else
            echo "No Python test files found. Test execution skipped."
          fi

  docker-build:
    name: Build VisionGuard Docker Image
    runs-on: ubuntu-latest
    needs: python-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: visionguard:ci-test

  docker-publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs:
      - python-checks
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/visionguard:latest
